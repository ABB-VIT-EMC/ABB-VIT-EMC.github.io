name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-docs.yml"
      - ".gitmodules"
      - "docs/**"
      - "tools/build_docs.py"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create short-lived token for documentation sources
        id: docs-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DOCS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.docs-app-token.outputs.token }}
          submodules: recursive

      # All submodules are public. This follows each submodule's configured
      # branch (or its remote default branch) without changing this repository.
      - name: Refresh documentation submodules
        run: git submodule update --init --remote --recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install the common documentation toolchain
        run: python -m pip install --upgrade pip sphinx shibuya

      - name: Build the documentation site
        run: python tools/build_docs.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
